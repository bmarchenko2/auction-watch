name: Prozorro + OLX watch

on:
  schedule:
    # Щодня о 14:00 UTC (16:00 за Цюрихом влітку, 15:00 взимку).
    - cron: "0 14 * * *"
    # Кожні 6 год — лише забрати нові /start і /stop (Telegram зберігає їх 24 год).
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Надіслати звіт одразу, не чекаючи 14:00 UTC"
        type: boolean
        default: true

permissions:
  contents: write   # щоб закомітити state.json

concurrency:
  group: auction-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests cryptography

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKFILL_DAYS: "30"
          REMIND_DAYS: "10"
          MIN_HECTARES: "1"
          SEND_EVERY_DAYS: "1"
          OLX_ENABLED: "0"   # OLX блокує GitHub; його перевіряє olx_watch.py на Mac
          FORCE_SEND: ${{ inputs.force_send && '1' || '0' }}
          SUBSCRIBERS_ONLY: ${{ github.event.schedule == '15 */6 * * *' && '1' || '0' }}
        run: python auction_watch.py

      - name: Save state
        run: |
          git config user.name "auction-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update auction-watch state"
          git push
